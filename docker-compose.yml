services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ask_the_archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://archive:archive@postgres:5432/ask_the_archive
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDINGS_MODEL: sentence-transformers/all-MiniLM-L6-v2
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    volumes:
      - document_data:/data
    depends_on:
      - postgres
      - ollama

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  document_data:
  ollama_data:
